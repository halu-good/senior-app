<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="시니어를 위한 가장 쉽고 세련된 복약 및 일정 관리 도우미. 소중한 건강을 위한 든든한 동반자가 되어 드립니다.">
    <title>시니어 복약 도우미</title>
    <!-- 프리미엄 Pretendard 웹 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <main id="main-content">
            <!-- 화면 내용이 app.js를 통해 여기에 표시됩니다 -->
        </main>
        
        <nav id="bottom-nav">
            <button class="nav-btn" data-target="calendar">
                <span class="icon"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
                <span>달력</span>
            </button>
            <button class="nav-btn active" data-target="home">
                <span class="icon"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
                <span>홈</span>
            </button>
            <button class="nav-btn" data-target="tips">
                <span class="icon"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></span>
                <span>건강</span>
            </button>
            <button class="nav-btn" id="settings-nav-btn" onclick="openSettings()">
                <span class="icon"><svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
                <span>설정</span>
            </button>
        </nav>

        <!-- ===== 설정 패널 오버레이 ===== -->
        <div id="settings-overlay" style="display:none;">
            <div id="settings-backdrop" onclick="closeSettings()"></div>
            <div id="settings-panel">
                <!-- 설정 패널 헤더 -->
                <div id="settings-header">
                    <div id="settings-drag-handle"></div>
                    <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 20px 16px;">
                        <h2 style="margin:0; font-size:1.5rem; font-weight:900; color:var(--text-main); display:flex; align-items:center; gap:8px;">
                            <svg width="22" height="22" fill="none" stroke="var(--accent)" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            설정
                        </h2>
                        <button onclick="closeSettings()" style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:none;font-size:1.2rem;color:var(--text-light);padding:0;box-shadow:none;">✕</button>
                    </div>
                </div>

                <div id="settings-body">

                    <!-- ① 알림 소리 섹션 -->
                    <div class="settings-section">
                        <div class="settings-section-title">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                            알림 소리
                        </div>

                        <div class="settings-card">
                            <div class="settings-row">
                                <span class="settings-label">알림 소리 크기</span>
                                <span class="settings-value-badge" id="volume-display">70%</span>
                            </div>
                            <div class="slider-track">
                                <div class="slider-icons">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
                                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                                </div>
                                <input type="range" id="volume-slider" min="0" max="100" value="70" oninput="updateVolume(this.value)">
                            </div>

                            <div class="settings-label" style="margin-top:16px; margin-bottom:10px;">알림 소리 선택</div>
                            <div class="sound-options">
                                <button class="sound-btn active" id="sound-0" onclick="selectSound(0)">
                                    <span class="sound-icon">🔔</span>
                                    <span>기본 벨</span>
                                </button>
                                <button class="sound-btn" id="sound-1" onclick="selectSound(1)">
                                    <span class="sound-icon">🎵</span>
                                    <span>잔잔한 멜로디</span>
                                </button>
                                <button class="sound-btn" id="sound-2" onclick="selectSound(2)">
                                    <span class="sound-icon">🎶</span>
                                    <span>경쾌한 알람</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- ② 화면 설정 섹션 -->
                    <div class="settings-section">
                        <div class="settings-section-title">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                            화면 설정
                        </div>

                        <div class="settings-card">
                            <div class="settings-row">
                                <span class="settings-label">글씨 크기</span>
                                <span class="settings-value-badge" id="fontsize-display">보통</span>
                            </div>
                            <div class="font-size-options">
                                <button class="fontsize-btn" id="fs-small" onclick="setFontSize('small')">
                                    <span style="font-size:0.85rem;">가</span>
                                    <span>작게</span>
                                </button>
                                <button class="fontsize-btn active" id="fs-medium" onclick="setFontSize('medium')">
                                    <span style="font-size:1rem;">가</span>
                                    <span>보통</span>
                                </button>
                                <button class="fontsize-btn" id="fs-large" onclick="setFontSize('large')">
                                    <span style="font-size:1.2rem;">가</span>
                                    <span>크게</span>
                                </button>
                                <button class="fontsize-btn" id="fs-xlarge" onclick="setFontSize('xlarge')">
                                    <span style="font-size:1.4rem;">가</span>
                                    <span>매우 크게</span>
                                </button>
                            </div>

                            <div class="settings-label" style="margin-top:20px; margin-bottom:10px;">테마 색상</div>
                            <div class="theme-color-options">
                                <button class="theme-color-btn active" id="theme-teal" onclick="setThemeColor('teal')" title="청록 (기본)">
                                    <div class="color-circle" style="background: linear-gradient(135deg,#0f766e,#10b981);"></div>
                                    <span>청록</span>
                                </button>
                                <button class="theme-color-btn" id="theme-blue" onclick="setThemeColor('blue')" title="블루">
                                    <div class="color-circle" style="background: linear-gradient(135deg,#1d4ed8,#3b82f6);"></div>
                                    <span>블루</span>
                                </button>
                                <button class="theme-color-btn" id="theme-purple" onclick="setThemeColor('purple')" title="보라">
                                    <div class="color-circle" style="background: linear-gradient(135deg,#7c3aed,#a78bfa);"></div>
                                    <span>보라</span>
                                </button>
                            </div>

                            <div class="settings-label" style="margin-top:20px; margin-bottom:10px;">홈 위젯 표시</div>
                            <div class="widget-toggles">
                                <div class="widget-toggle-row">
                                    <span>복약 성실도 카드</span>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="widget-adherence" checked onchange="toggleWidget('adherence', this.checked)">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="widget-toggle-row">
                                    <span>병원 일정 카드</span>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="widget-hospital" checked onchange="toggleWidget('hospital', this.checked)">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="widget-toggle-row">
                                    <span>건강 팁 위젯</span>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="widget-tips" onchange="toggleWidget('tips', this.checked)">
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ③ 기록 모아보기 섹션 -->
                    <div class="settings-section">
                        <div class="settings-section-title">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            기록 모아보기
                        </div>

                        <div class="settings-card">
                            <div class="record-btn-group">
                                <button class="record-view-btn" onclick="openMedHistory()">
                                    <div class="record-btn-icon" style="background: linear-gradient(135deg,#0f766e,#10b981);">
                                        <svg width="22" height="22" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                    </div>
                                    <div class="record-btn-text">
                                        <strong>복용 약 기록</strong>
                                        <span>지금까지 복용한 약 정보와 사진 모아보기</span>
                                    </div>
                                    <svg width="18" height="18" fill="none" stroke="var(--text-light)" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                </button>

                                <button class="record-view-btn" onclick="openHospHistory()">
                                    <div class="record-btn-icon" style="background: linear-gradient(135deg,#f43f5e,#e11d48);">
                                        <svg width="22" height="22" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                    </div>
                                    <div class="record-btn-text">
                                        <strong>병원 예약 기록</strong>
                                        <span>최근 1년 예약 내역 전체 보기</span>
                                    </div>
                                    <svg width="18" height="18" fill="none" stroke="var(--text-light)" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                </div><!-- /settings-body -->
            </div><!-- /settings-panel -->
        </div><!-- /settings-overlay -->

        <!-- 복용 약 기록 모달 -->
        <div id="med-history-modal" class="modal-overlay" style="display:none;">
            <div class="modal-box" style="max-height:85vh; overflow-y:auto; text-align:left; padding:24px 20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="margin:0; font-size:1.4rem;">💊 복용 약 기록</h2>
                    <button onclick="document.getElementById('med-history-modal').style.display='none'" style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;font-size:1.1rem;color:var(--text-light);padding:0;box-shadow:none;">✕</button>
                </div>
                <div id="med-history-content"></div>
            </div>
        </div>

        <!-- 병원 예약 기록 모달 -->
        <div id="hosp-history-modal" class="modal-overlay" style="display:none;">
            <div class="modal-box" style="max-height:85vh; overflow-y:auto; text-align:left; padding:24px 20px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="margin:0; font-size:1.4rem;">🏥 병원 예약 기록 (최근 1년)</h2>
                    <button onclick="document.getElementById('hosp-history-modal').style.display='none'" style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;font-size:1.1rem;color:var(--text-light);padding:0;box-shadow:none;">✕</button>
                </div>
                <div id="hosp-history-content"></div>
            </div>
        </div>

        <!-- 커스텀 모달 (앱 자체 팝업) -->
        <div id="custom-modal" class="modal-overlay" style="display: none;">
            <div class="modal-box" style="max-height: 90vh; overflow-y: auto;">
                <h2 id="modal-title">알림</h2>
                <img id="modal-img" src="" style="width: 100%; border-radius: 4px; margin-bottom: 15px; display: none;" alt="안내 이미지">
                <p id="modal-message">메시지 내용</p>
                <input type="text" id="modal-input" style="display: none;">
                <div class="modal-buttons">
                    <button id="modal-btn-cancel" class="btn-outline" style="display: none;">취소</button>
                    <button id="modal-btn-confirm" class="btn-primary" style="margin-bottom: 0;">확인</button>
                </div>
            </div>
        </div>

        <!-- 보이지 않는 카메라/갤러리 입력 요소 -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;" onchange="handleCameraInput(event)">

    </div>
    <script src="app.js"></script>
</body>
</html>
